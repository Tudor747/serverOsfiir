server {
    listen 443 ssl default_server;
    server_name localhost kali.test;

    ssl_certificate /etc/nginx/local-tls/server.crt;
    ssl_certificate_key /etc/nginx/local-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    default_type text/plain;

    # This is an infrastructure check, with no app or database behind it.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location / {
        return 200 "Kali test server is ready.\n";
    }
}

