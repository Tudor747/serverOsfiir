name: kali-server-test

services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTPS_PORT:-443}:443/tcp"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./state/tls:/etc/nginx/local-tls:ro
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 100
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

