name: Check Kali test server
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate the local configuration
        run: |
          docker compose --env-file kali/.env.example -f kali/compose.yaml config --quiet
          for script in kali/*.sh; do bash -n "$script"; done
      - name: Start Nginx and check local HTTPS
        # This exercises Docker and TLS. The Kali apt installer is not run on Ubuntu.
        run: bash kali/start.sh
      - name: Stop the test server
        if: always()
        run: bash kali/stop.sh
